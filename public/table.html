<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>King's Gambit</title>
  <link rel="stylesheet" href="/css/table.css">
  <link rel="stylesheet" href="/css/effects.css">
</head>
<body class="room">
  <div class="room-frame" aria-hidden="true">
    <span class="dia tl"><svg viewBox="0 0 20 28"><path d="M10 1 L19 14 L10 27 L1 14 Z"/></svg></span><span class="dia tr"><svg viewBox="0 0 20 28"><path d="M10 1 L19 14 L10 27 L1 14 Z"/></svg></span>
    <span class="dia bl"><svg viewBox="0 0 20 28"><path d="M10 1 L19 14 L10 27 L1 14 Z"/></svg></span><span class="dia br"><svg viewBox="0 0 20 28"><path d="M10 1 L19 14 L10 27 L1 14 Z"/></svg></span>
  </div>
  <header class="topbar">
    <a class="brand" href="/">♛ KING'S GAMBIT</a>
    <span class="round-info" id="roundInfo"></span>
  </header>

  <main class="stage">
    <div class="table" id="table">
      <!-- The table: a wooden rim with brass studs, a dark band with gold stitching, and red felt. -->
      <div class="rim" id="rim"><div class="band"><div class="felt"></div></div></div>
      <div class="center" id="center"></div>
      <div id="seats"></div>
      <div class="podium hidden" id="podium"></div>
    </div>
  </main>

  <aside class="feed-panel">
    <div class="feed" id="feed"></div>
    <form class="chat-form" id="chatForm" autocomplete="off">
      <input id="chatInput" maxlength="200" placeholder="Send a message…">
    </form>
  </aside>

  <section class="actions" id="actions"></section>

  <div class="modal hidden" id="sitModal">
    <form class="modal-card" id="sitForm">
      <label for="nameInput">Your nickname</label>
      <input id="nameInput" maxlength="16" placeholder="Your name" required>
      <button class="btn btn-green" type="submit">Take the seat</button>
      <button class="btn btn-ghost" type="button" id="sitCancel">Cancel</button>
    </form>
  </div>

  <div class="modal hidden" id="knockModal" role="dialog" aria-modal="true" aria-labelledby="knockTitle">
    <div class="modal-card knock-card">
      <h3 id="knockTitle">Confirm Knocking?</h3>
      <p>Everyone else gets one last turn, then your cards are revealed. You can't take it back.</p>
      <button class="btn btn-gold" type="button" data-knock-yes>Knock</button>
      <button class="btn btn-ghost" type="button" data-knock-no>Keep playing</button>
    </div>
  </div>

  <div class="modal hidden" id="settingsModal">
    <form class="modal-card settings-card" id="settingsForm"></form>
  </div>

  <div class="toast hidden" id="toast"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/cards.js"></script>
  <script src="/js/effects.js"></script>
  <script src="/js/table.js"></script>
</body>
</html>
